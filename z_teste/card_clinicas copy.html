<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínicas CASSI - Unidades</title>
    <style>
        body {
            background-color: #D9D9D9;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .filtro-container {
            margin-bottom: 20px;
            text-align: center;
        }

        .filtro-container label {
            font-weight: bold;
            margin-right: 10px;
            color: #002D4B;
        }

        .filtro-container select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #002D4B;
            background-color: white;
            font-size: 16px;
            color: #002D4B;
        }

        .card-unidades {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 30px auto;
            padding: 20px 5px;
            height: auto;
            width: 500px;
            border: 1px solid black;
            border-radius: 4px;
            box-shadow: 2px 5px 8px rgba(126, 126, 126, 0.74);
            background-color: rgb(255, 255, 255);
            color: #002D4B;
        }

        .card-infos,
        li {
            list-style: none;
            margin: 10px;
        }

        .card-titulo,
        h3 {
            font-size: larger;
            font-weight: 600;
            text-align: right;
            background-color: silver;
            margin: auto 30px;
            padding: 10px;
        }

        .exp-container {
            background-color: rgb(172, 172, 148);
            margin: 30px;
            padding: 5px;
            border-radius: 10px;
            border-style: none none solid none;
            border-color: #002D4B;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .exp-title {
            background-color: aqua;
            color: #081250;
            margin: 0 auto;
            padding: 5px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exp-title::after {
            content: '+';
            font-weight: bold;
            font-size: 18px;
        }

        .exp-container.expanded .exp-title::after {
            content: '-';
        }

        .exp-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .exp-container.expanded .exp-content {
            max-height: 2000px;
            /* Aumentado para conteúdo longo */
            padding-top: 10px;
            overflow-y: auto;
            /* Adiciona scroll se necessário */
        }

        .lista-servicos {
            padding-left: 20px;
        }

        .lista-servicos li {
            margin-bottom: 8px;
            list-style-type: disc;
            line-height: 1.4;
        }

        .mensagem-vazia {
            text-align: center;
            padding: 20px;
            font-size: 18px;
            color: #666;
        }

        .status-message {
            text-align: center;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 5px;
        }

        .loading {
            background-color: #e3f2fd;
            color: #1976d2;
        }

        .error {
            background-color: #ffe6e6;
            color: #d32f2f;
            border: 1px solid #d32f2f;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>
    <!-- Elementos de status -->
    <div id="loading" class="status-message loading" style="display: none;">
        Carregando dados das clínicas...
    </div>
    <div id="error" class="status-message error" style="display: none;"></div>

    <!-- Filtro por UF -->
    <div class="filtro-container">
        <label for="filtro-uf">Filtrar por UF:</label>
        <select id="filtro-uf">
            <option value="df">DF</option>
            <!-- Outras UFs serão adicionadas dinamicamente -->
        </select>
    </div>

    <!-- Container para os cards -->
    <div id="cards-container">
        <!-- Os cards serão inseridos aqui pelo JavaScript -->
    </div>

    <script>
        // Dados globais
        let dadosClinicas = [];
        let dadosFiltrados = [];

        // Elementos DOM
        let loadingElement;
        let errorElement;
        let filtroUFElement;
        let cardsContainer;

        // Inicialização quando o DOM estiver carregado
        document.addEventListener('DOMContentLoaded', function () {
            // Inicializar elementos DOM
            loadingElement = document.getElementById('loading');
            errorElement = document.getElementById('error');
            filtroUFElement = document.getElementById('filtro-uf');
            cardsContainer = document.getElementById('cards-container');

            // Configurar event listeners
            filtroUFElement.addEventListener('change', function () {
                filtrarUnidades(this.value);
            });

            // Iniciar carregamento dos dados
            loadRemoteCSV();
        });

        // Função para carregar o CSV
        async function loadRemoteCSV() {
            try {
                loadingElement.style.display = 'block';
                errorElement.style.display = 'none';
                errorElement.textContent = '';

                // Carrega o arquivo CSV local
                const response = await fetch('../data/dados_clinica.csv');

                if (!response.ok) {
                    throw new Error(`Erro ${response.status}: ${response.statusText}`);
                }

                const csvData = await response.text();
                processCSV(csvData);

                // Atualiza a cada 5 minutos (opcional)
                setTimeout(loadRemoteCSV, 300000);

            } catch (error) {
                console.error('Erro ao carregar CSV:', error);
                errorElement.textContent = `Erro ao carregar dados: ${error.message}`;
                errorElement.style.display = 'block';
                loadingElement.style.display = 'none';

                // Tentar novamente após 1 minuto
                setTimeout(loadRemoteCSV, 60000);
            }
        }

        // Função para processar os dados do CSV
        function processCSV(csvData) {
            try {
                // Converte CSV para array de objetos
                dadosClinicas = csvToArray(csvData);

                // Armazena globalmente
                window.dadosClinicas = dadosClinicas;

                // Popula o seletor de UF
                popularSeletorUF(dadosClinicas);

                // Filtra e exibe as unidades (DF por padrão)
                filtrarUnidades('df', dadosClinicas);

                loadingElement.style.display = 'none';

            } catch (error) {
                console.error('Erro ao processar CSV:', error);
                errorElement.textContent = `Erro ao processar dados: ${error.message}`;
                errorElement.style.display = 'block';
                loadingElement.style.display = 'none';
            }
        }

        // Função para converter CSV para array de objetos
        function csvToArray(csv) {
            // Use PapaParse to correctly handle quoted fields with newlines
            if (window.Papa && typeof Papa.parse === 'function') {
                const parsed = Papa.parse(csv, {
                    delimiter: ';',
                    header: true,
                    skipEmptyLines: false,
                    transformHeader: header => header.trim()
                });

                // Normalize and trim values
                return parsed.data.map(row => {
                    const obj = {};
                    for (const key in row) {
                        const trimmedKey = key.trim();
                        obj[trimmedKey] = row[key] != null ? String(row[key]).trim() : '';
                    }
                    return obj;
                });
            }

            // Fallback (menos robusto) caso PapaParse não esteja disponível
            const linhas = csv.split('\n').filter(line => line.trim() !== '');

            if (linhas.length === 0) {
                throw new Error('Arquivo CSV vazio');
            }

            // Remove BOM se existir (caractere especial no início do arquivo)
            const primeiraLinha = linhas[0].replace(/^\uFEFF/, '');
            const cabecalhos = primeiraLinha.split(';').map(header => header.trim());

            const resultado = [];

            for (let i = 1; i < linhas.length; i++) {
                const obj = {};
                const linhaAtual = linhas[i].split(';');

                for (let j = 0; j < cabecalhos.length; j++) {
                    obj[cabecalhos[j]] = linhaAtual[j] ? linhaAtual[j].trim() : '';
                }

                resultado.push(obj);
            }

            return resultado;
        }

        // Função para popular o seletor de UF
        function popularSeletorUF(dados) {
            const ufs = [...new Set(dados.map(unidade => unidade.uf))].filter(uf => uf);

            const seletor = document.getElementById('filtro-uf');
            seletor.innerHTML = ''; // Limpa opções existentes

            ufs.forEach(uf => {
                const option = document.createElement('option');
                option.value = uf.toLowerCase();
                option.textContent = uf;
                seletor.appendChild(option);
            });
        }

        // Função para filtrar unidades por UF
        function filtrarUnidades(uf) {
            const unidadesFiltradas = dadosClinicas.filter(unidade =>
                unidade.uf && unidade.uf.toLowerCase() === uf.toLowerCase()
            );

            dadosFiltrados = unidadesFiltradas;
            exibirCards(unidadesFiltradas);
        }

        // Função para exibir os cards
        function exibirCards(unidades) {
            cardsContainer.innerHTML = '';

            if (unidades.length === 0) {
                cardsContainer.innerHTML = '<div class="mensagem-vazia">Nenhuma unidade encontrada para esta UF.</div>';
                return;
            }

            unidades.forEach(unidade => {
                const card = criarCardUnidade(unidade);
                cardsContainer.appendChild(card);
            });
        }

        // Função para criar um card de unidade - CORRIGIDA
        function criarCardUnidade(dados) {
            const card = document.createElement('div');
            card.className = 'card-unidades';

            // Função auxiliar para escapar HTML (evita quebras inesperadas ou XSS)
            function escapeHtml(str) {
                if (str == null) return '';
                return String(str).replace(/[&<>"'`=\/]/g, function (s) {
                    return ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;',
                        '`': '&#96;',
                        '=': '&#61;',
                        '/': '&#47;'
                    })[s];
                });
            }

            // Função auxiliar para processar listas com split por "|" ou outros separadores
            function processarLista(texto) {
                if (!texto) return '<li>Nenhuma informação disponível</li>';

                // Normaliza o texto
                let s = String(texto || '').trim();

                // Remove aspas externas
                s = s.replace(/^\s*"|"\s*$/g, '').trim();

                // Converte <br> e entidades de nova linha para newline
                s = s.replace(/<br\s*\/?>/gi, '\n');
                s = s.replace(/(&#13;|&#10;|\\r\\n|\\n|\\r)/gi, '\n');

                // Divide por pipe em partes de topo e limpa
                const partesTopo = s.split(/\|/).map(p => p.trim()).filter(p => p !== '');

                const itens = [];

                partesTopo.forEach(parte => {
                    // Quebra em linhas e também separa por ponto-e-vírgula
                    const linhas = parte.split(/\r?\n/).flatMap(l => l.split(';')).map(l => l.trim()).filter(l => l !== '');

                    let atual = null;

                    linhas.forEach(linha => {
                        if (/^\d+\./.test(linha)) {
                            // item numerado
                            const titulo = linha.replace(/^\d+\.\s*/, '').replace(/\.+$/,'').trim();
                            atual = { title: titulo, subs: [] };
                            itens.push(atual);
                        } else if (/^[a-zA-Z]\./.test(linha)) {
                            // subitem letra
                            const sub = linha.replace(/^[a-zA-Z]\.(\s*)/, '').replace(/\.+$/,'').trim();
                            if (atual) {
                                atual.subs.push(sub);
                            } else {
                                // caso não haja um item numerado antes, cria um item simples e adiciona como subs
                                atual = { title: '', subs: [sub] };
                                itens.push(atual);
                            }
                        } else {
                            // linha livre: se existir um item atual sem subs, concatena ao título; caso contrário cria novo item
                            if (atual && atual.subs.length === 0 && atual.title) {
                                atual.title = (atual.title + ' ' + linha).trim();
                            } else {
                                atual = { title: linha.replace(/\.+$/,'').trim(), subs: [] };
                                itens.push(atual);
                            }
                        }
                    });
                });

                if (itens.length === 0) return '<li>Nenhuma informação disponível</li>';

                // Monta HTML com <ol> numerado e, quando houver subs, <ol type="a"> para letras
                let html = '<ol>';
                itens.forEach(it => {
                    html += `<li>${escapeHtml(it.title)}`;
                    if (it.subs && it.subs.length) {
                        html += '<ol type="a">';
                        it.subs.forEach(sub => {
                            html += `<li>${escapeHtml(sub)}</li>`;
                        });
                        html += '</ol>';
                    }
                    html += '</li>';
                });
                html += '</ol>';

                return html;
            }

            // Criar lista de serviços
            const listaServicos = processarLista(dados.servicos_of);

            // Criar lista de procedimentos
            const listaProcedimentos = processarLista(dados.procedimentos);

            card.innerHTML = `
                <h3 class="card-titulo">${escapeHtml(dados.titulo)}</h3>
                <nav class="card-infos">
                    <ul>
                        <li><b>Endereço:</b> ${escapeHtml(dados.endereco)}</li>
                        <br>
                        <li><b>Telefone:</b> ${escapeHtml(dados.telefone)}</li>
                        <li><b>Contato:</b> ${escapeHtml(dados.contato)}</li>
                        <li><b>CNPJ:</b> ${escapeHtml(dados.cnpj)}</li>
                        <li><b>Horário de atendimento:</b> ${escapeHtml(dados.horario_atend)}</li>
                    </ul>
                </nav>

                <nav class="exp-container" id="drop-1">
                    <h4 class="exp-title"><b>Serviços Oferecidos:</b></h4>
                    <div class="exp-content">
                        <ul class="lista-servicos">
                            ${listaServicos}
                        </ul>
                    </div>
                </nav>

                <nav class="exp-container" id="drop-2">
                    <h4 class="exp-title"><b>Procedimentos:</b></h4>
                    <div class="exp-content">
                        <ul class="lista-servicos">
                            ${listaProcedimentos}
                        </ul>
                    </div>
                </nav>

                <nav>
                    <ul>
                        <li><b>Gerente da Unidade:</b> ${escapeHtml(dados.gerente_uni)}</li>
                        <li><b>Gerente Clínica:</b> ${escapeHtml(dados.gerente_clin)}</li>
                    </ul>
                </nav>
            `;

            // Adicionar funcionalidade de acordeão
            const expansores = card.querySelectorAll('.exp-container');
            expansores.forEach(expansor => {
                expansor.addEventListener('click', function () {
                    this.classList.toggle('expanded');
                });
            });

            return card;
        }
    </script>
</body>

</html>
